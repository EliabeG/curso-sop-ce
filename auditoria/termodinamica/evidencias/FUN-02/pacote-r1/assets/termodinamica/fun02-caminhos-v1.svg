<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" role="img" aria-labelledby="title desc">
<title id="title">Dois caminhos entre A e B e trabalho líquido do ciclo</title>
<desc id="desc">Diagrama p-V quantitativo para um mol de gás ideal monoatômico. Eixo horizontal: volume de 8 a 22 litros; vertical: pressão absoluta de 0 a 280 quilopascais. A: 10 litros, 249,420 kPa, 300 K. B: 20 litros, 187,065 kPa, 450 K. Rota I azul: expansão isobárica A-C até 20 litros e 600 K, seguida de resfriamento isocórico C-B. Rota II laranja: expansão isotérmica a 300 K de A-D, seguida de aquecimento isocórico D-B. D tem 20 litros e 124,710 kPa. A área sombreada entre os caminhos corresponde a 765,35 joules de trabalho positivo no ciclo que percorre I na ida e II ao contrário na volta.</desc>
