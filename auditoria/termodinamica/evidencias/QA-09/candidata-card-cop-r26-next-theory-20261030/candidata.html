<details class="flashcard"><summary>COP</summary><div class="flash-resposta"><p>Em ciclo de refrigeração ou bomba de calor por compressão cujo acionamento é somente trabalho, COP é o calor útil dividido pelo trabalho líquido total recebido, positivo, para a mesma fronteira e ciclo: calor retirado da fonte fria no refrigerador ou entregue à fonte quente na bomba de calor.</p></div></details>
